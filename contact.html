<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Halime Barut</title>
  <link rel="stylesheet" href="style.css">
  <script src="swipe.js" defer></script>
</head>
<body>
  <!-- Shared menu: the same on every page. Only aria-current moves. -->
  <nav class="site-nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>

  <main>
    <h1>Contact</h1>
    <p>I'd love to hear from you! Send me a message below.</p>

    <!-- Formspree receives the form and emails it to me, so no server of my own is needed. -->
    <form class="contact-form" action="https://formspree.io/f/mqpebklr" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button class="button" type="submit">Send message</button>
    </form>

    <!-- mailto: opens the visitor's email app with my address already filled in -->
    <p>Prefer email? <a class="button" href="mailto:baruthalime41@gmail.com">Email me</a></p>

    <p>You can also find me here:</p>
    <ul>
      <li><a href="https://www.instagram.com/hlm_ee3/">Instagram</a></li>
      <li><a href="https://github.com/baruthalime41-cmd">GitHub</a></li>
    </ul>

    <div class="swipe-hint"><span>Swipe ← → or keep scrolling ↓ to change page</span><button class="hint-close" type="button" aria-label="Hide hint">×</button></div>
  </main>
</body>
</html>
